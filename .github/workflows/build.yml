name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Desktop (SILO_AML=OFF)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgl-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # libsilo-aml is excluded: extracted Kodi code keeps upstream formatting.
      - name: Check formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          git ls-files '*.cpp' '*.h' ':!:libsilo-aml/**' \
            | xargs --no-run-if-empty clang-format-18 --dry-run --Werror
